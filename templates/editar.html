<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Editar Produto - NG+ Supermercado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Editar Produto: {{ produto[1] }}</h4>
        </div>
        <div class="card-body p-4">
            <form action="/atualizar/{{ produto[0] }}" method="POST" class="row g-3">
                <div class="col-md-12">
                    <label class="form-label fw-bold">Nome do Produto</label>
                    <input type="text" name="nome" class="form-control" value="{{ produto[1] }}" required>
                </div>
                
                <div class="col-md-6">
                    <label class="form-label fw-bold">Preço (R$)</label>
                    <input type="number" name="preco" step="0.01" class="form-control" value="{{ produto[2] }}" required>
                </div>
                
                <div class="col-md-6">
                    <label class="form-label fw-bold">Estoque Atual (Qtd)</label>
                    <input type="number" name="quantidade" class="form-control" value="{{ produto[3] }}" required>
                </div>
                
                <div class="col-md-12">
                    <label class="form-label fw-bold">URL da Imagem</label>
                    <input type="url" name="imagem_url" class="form-control" value="{{ produto[4] if produto[4] else '' }}">
                </div>
                
                <div class="col-12 mt-4 d-flex justify-content-between">
                    <a href="/admin" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
