<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Admin - NG+ Supermercado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-custom p-3 mb-4">
        <div class="container-fluid container">
            <h1 class="navbar-brand text-white fs-3 m-0">NG+ Admin - Estoque</h1>
            <div>
                <a href="/admin/historico" class="btn btn-info text-white me-2">Histórico de Vendas</a>
                <a href="/" class="btn btn-outline-light me-2">Voltar para Loja</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card card-body mb-4 shadow-sm bg-white border-0">
            <h5 class="card-title mb-3">Cadastrar Novo Produto</h5>
            <form action="/adicionar" method="POST" class="row g-3">
                <div class="col-md-3">
                    <input type="text" name="nome" class="form-control" placeholder="Nome" required>
                </div>
                <div class="col-md-2">
                    <input type="number" name="preco" step="0.01" class="form-control" placeholder="Preço (R$)" required>
                </div>
                <div class="col-md-2">
                    <input type="number" name="quantidade" class="form-control" placeholder="Qtd" required>
                </div>
                <div class="col-md-3">
                    <input type="url" name="imagem_url" class="form-control" placeholder="URL da Imagem (Opcional)">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-dark w-100">Salvar</button>
                </div>
            </form>
        </div>

        <table class="table table-hover bg-white shadow-sm align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Foto</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for p in produtos %}
                <tr>
                    <td>
                        {% if p[4] %}
                        <img src="{{ p[4] }}" width="50" height="50" style="object-fit:cover; border-radius: 5px;">
                        {% else %}
                        -
                        {% endif %}
                    </td>
                    <td class="fw-bold">{{ p[1] }}</td>
                    <td class="text-success fw-bold">R$ {{ "%.2f"|format(p[2]) }}</td>
                    <td>{{ p[3] }} un.</td>
                    <td>
                        <a href="/editar/{{ p[0] }}" class="btn btn-primary btn-sm">Editar</a>
                        <a href="/deletar/{{ p[0] }}" class="btn btn-danger btn-sm">Deletar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
