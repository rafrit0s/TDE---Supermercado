<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Login - NG+ Supermercado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow-sm" style="width: 350px;">
        <h3 class="text-center mb-4">Acesso ADM</h3>
        {% with messages = get_flashed_messages() %}
            {% if messages %} <div class="alert alert-danger">{{ messages[0] }}</div> {% endif %}
        {% endwith %}
        <form action="/login" method="POST">
            <input type="password" name="senha" class="form-control mb-3" placeholder="Senha" required>
            <button type="submit" class="btn btn-dark w-100 mb-2">Entrar</button>
            <a href="/" class="btn btn-outline-secondary w-100">Voltar à Loja</a>
        </form>
    </div>
</body>
</html>
